name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SearchDuplicateFiles.sln

      - name: Verify formatting
        run: dotnet format SearchDuplicateFiles.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SearchDuplicateFiles.sln --configuration Release --no-restore
